<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Voice Matters</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>Your voice is very important for us</h1>
      <p>
        Three quick questions, about a minute. Your name is optional — we're
        looking for patterns across the team, not calling anyone out.
      </p>
    </header>

    <form class="panel" id="feedback-form">
      <div class="field">
        <label class="field-label" for="name">Name</label>
        <span class="field-hint">Optional — leave it blank if you'd rather stay anonymous.</span>
        <input type="text" id="name" name="name" autocomplete="name" />
      </div>

      <div class="field">
        <label class="field-label" for="tenure">How long have you been working in the call center?</label>
        <select id="tenure" name="tenure" required>
          <option value="" disabled selected>Select one</option>
          <option value="Less than 6 months">Less than 6 months</option>
          <option value="6 months to 1 year">6 months – 1 year</option>
          <option value="1 to 3 years">1–3 years</option>
          <option value="3 to 5 years">3–5 years</option>
          <option value="5+ years">5+ years</option>
        </select>
      </div>

      <div class="field">
        <label class="field-label" for="pain-point">Where do you run into the most trouble while handling a client's call?</label>
        <textarea
          id="pain-point"
          name="painPoint"
          required
          placeholder="e.g. Looking up a customer's order history takes too many screens"
        ></textarea>
      </div>

      <div class="field">
        <label class="field-label" for="wish">If we could fix one thing, what would make the biggest difference for you?</label>
        <textarea
          id="wish"
          name="wish"
          required
          placeholder="e.g. A faster way to transfer calls without losing the customer's context"
        ></textarea>
      </div>

      <div class="field">
        <button type="submit" class="primary" id="submit-btn">Send Feedback</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </div>
    </form>
  </main>

  <script src="submit.js"></script>
</body>
</html>
