<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Share Your Feedback</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app narrow">
    <header class="app-header">
      <h1>What would make your work easier?</h1>
      <p>
        Tools, process changes, training, anything you wish worked better day to day.
        Your product manager reads every submission.
      </p>
    </header>

    <section class="input-panel">
      <textarea
        id="feedback-input"
        placeholder="e.g. The call transfer button is hard to find, or I wish we had a faster way to look up customer order history..."
      ></textarea>

      <div class="controls">
        <button id="submit-btn" class="primary">Submit Feedback</button>
      </div>

      <p id="status" class="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="submit.js"></script>
</body>
</html>
