<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page wide">
    <header class="page-header">
      <h1>Feedback Dashboard</h1>
      <p>Everything submitted by the team. Analyze to sort into themes, then mark items as synced once they're in your backlog.</p>
    </header>

    <div class="toolbar">
      <div class="toolbar-group">
        <button id="analyze-btn" class="primary">Analyze New Feedback</button>
        <button id="refresh-btn" class="secondary">Refresh</button>
      </div>
      <div class="toolbar-group">
        <label class="checkbox-row">
          <input type="checkbox" id="show-synced" />
          Show synced items
        </label>
        <select id="experience-filter" aria-label="Filter by experience">
          <option value="">All experience levels</option>
          <option value="Less than 6 months">Less than 6 months</option>
          <option value="6 months to 1 year">6 months – 1 year</option>
          <option value="1 to 3 years">1–3 years</option>
          <option value="3 to 5 years">3–5 years</option>
          <option value="5+ years">5+ years</option>
        </select>
        <button id="export-csv-btn" class="secondary">Export CSV</button>
        <button id="export-md-btn" class="secondary">Export Markdown</button>
      </div>
    </div>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <details class="panel backlog-panel">
      <summary>Your backlog <span id="backlog-count" class="theme-count"></span></summary>
      <div id="backlog-list" class="backlog-list"></div>
      <form id="backlog-form" class="backlog-form">
        <input type="text" id="backlog-title" placeholder="Backlog item title" required />
        <input type="text" id="backlog-description" placeholder="Short description (optional)" />
        <button type="submit" class="secondary">Add</button>
      </form>
    </details>

    <section>
      <div class="section-heading">
        <h2>Themes</h2>
        <div id="summary" class="summary-line"></div>
      </div>
      <div id="theme-groups" class="theme-groups"></div>
    </section>
  </main>

  <script src="playbook.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
